name: CI

# Run the test suite and a production build on every push and PR to main, so the
# fairness math and exports are proven green before anything ships.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Firebase web config values aren't secrets, and the build only warns when
      # they're absent — so CI can build without any .env to prove it compiles.
      - name: Production build
        run: npm run build
